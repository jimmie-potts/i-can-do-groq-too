name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check static repository policy
        run: python3 scripts/check_repository.py

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify provisioned Go version
        shell: bash
        run: |
          expected_version="$(awk '$1 == "go" { print "go" $2 }' go.mod)"
          actual_version="$(GOTOOLCHAIN=local go env GOVERSION)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Expected $expected_version from go.mod, got $actual_version" >&2
            exit 1
          fi

      - name: Run repository checks
        run: ./scripts/check
